version: '3.8'
services:
  mongo:
    image: mongo
    ports:
      - "27018:27017"
    container_name: mongo
    volumes:
      - mongo-data:/data/db
  backend:
    container_name: backend
    build: ./Server
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    volumes:
      - ./Server:/app
      - /app/node_modules
  frontend:
    build: ./FarmerMarket
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./FarmerMarket:/app
      - /app/node_modules
volumes:
  mongo-data: